[package]
name = "db_entity"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
sea-orm = { version = "1", features = [
    "macros",
    "mock",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
